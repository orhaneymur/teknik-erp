# Martech  —  tenant-martech
#
# Ikinci musteri. 21 Eylul 2026'da acildi. Sifirdan basladi, urunler
# Excel'den tek seferde yuklendi.
#
# Kurulum (sunucuda, /root/teknikerp):
#   bash k8s/new-tenant.sh martech "Martech" -f tenants/martech.yaml
# Ayar degisikligi:
#   helm upgrade teknikerp charts/teknikerp -n tenant-martech --reuse-values -f tenants/martech.yaml

tenant:
  id: martech
  companyName: "Martech"
  # Doviz kuru farki (TL) — Harem SATIS kurunun uzerine eklenir.
  # TL tahsilatin dolara cevrilmesini de etkiler. Chart varsayilani ile
  # ayni; Orhan "kur farkina sonra bakalim" dedi (21 Eylul 2026) — karar
  # verilince burasi ve helm upgrade.
  kurFarki: 0.20
  # Fisin ustune basilan logo — data URI olarak gomulu (chart /logo.png
  # dosyasini mount ETMIYOR; tek calisan bicim bu).
  # Kaynak: musterinin 512x512 renkli PNG'si; bosluklari kirpilip 1 bit
  # siyah-beyaza cevrildi (termal kafa icin) -> tenants/martech-logo.png
  # (418x138, 1,2 KB). Logo degisirse ayni islem: kirp, 1 bit, base64.
  logoUrl: "data:image/png;base64,"

image:
  # DIKKAT: chart varsayilani v1.9.2 — new-tenant.sh bunu ezmez, bu dosya ezer.
  # Canli Shenzhen ile ayni surum (helm list, 21 Eylul 2026).
  tag: v1.22.24

ingress:
  # Kendi alan adi (zone Cloudflare'de, kayit Proxied). Tek seviye — Universal SSL kapsar.
  host: martech.mobilteknikerp.com

backend:
  replicas: 1
