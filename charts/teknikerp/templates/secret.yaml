{{/*
Müşteriye özel gizli değerler.

ÖNEMLİ: Şifreler ilk kurulumda rastgele üretilir, sonraki her `helm upgrade`
işleminde `lookup` ile MEVCUT Secret'tan okunarak korunur. Bu olmasaydı her
upgrade yeni şifre üretir, MySQL ise kök şifresini yalnızca ilk açılışta
uyguladığı için backend veritabanına bağlanamaz hale gelirdi.
*/}}
{{- $secretName := include "teknikerp.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}

{{- $mysqlPassword := "" -}}
{{- $jwtSecret := "" -}}
{{- $adminPassword := "" -}}

{{- if $existing -}}
  {{- $mysqlPassword = (index $existing.data "mysql-root-password" | b64dec) -}}
  {{- $jwtSecret = (index $existing.data "jwt-secret" | b64dec) -}}
  {{- $adminPassword = (index $existing.data "admin-password" | b64dec) -}}
{{- end -}}

{{/* values.yaml'da açıkça verilmişse o kazanır (şifre sıfırlama yolu) */}}
{{- if .Values.mysql.rootPassword -}}{{- $mysqlPassword = .Values.mysql.rootPassword -}}{{- end -}}
{{- if .Values.auth.jwtSecret -}}{{- $jwtSecret = .Values.auth.jwtSecret -}}{{- end -}}
{{- if .Values.auth.adminPassword -}}{{- $adminPassword = .Values.auth.adminPassword -}}{{- end -}}

{{/* Hâlâ boşsa ilk kurulumdayız — rastgele üret. Yalnızca harf/rakam:
     DATABASE_URL içinde kaçış (escaping) sorunu çıkmasın. */}}
{{- if not $mysqlPassword -}}{{- $mysqlPassword = randAlphaNum 24 -}}{{- end -}}
{{- if not $jwtSecret -}}{{- $jwtSecret = randAlphaNum 48 -}}{{- end -}}
{{- if not $adminPassword -}}{{- $adminPassword = randAlphaNum 14 -}}{{- end -}}

{{- $databaseUrl := printf "mysql://root:%s@%s:3306/%s" $mysqlPassword (include "teknikerp.mysqlName" .) (include "teknikerp.database" .) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "teknikerp.labels" . | nindent 4 }}
  annotations:
    # helm uninstall sonrası da kalsın — yanlışlıkla silinen kurulum geri
    # yüklendiğinde MySQL diskindeki veriye aynı şifreyle erişilebilsin.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mysql-root-password: {{ $mysqlPassword | quote }}
  database-url: {{ $databaseUrl | quote }}
  jwt-secret: {{ $jwtSecret | quote }}
  admin-password: {{ $adminPassword | quote }}
