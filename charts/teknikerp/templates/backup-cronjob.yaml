{{- if .Values.backup.enabled -}}
{{/*
Gecelik veritabanı yedeği.

UYARI: Yedekler kümenin KENDİ diskinde durur. Sunucu diskini kaybedersen
yedekler de gider. Üretimde bu PVC'yi düzenli olarak küme dışına
(S3 / Hetzner Storage Box / harici disk) kopyalayan bir iş de kurmalısın.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teknikerp-backup-pvc
  labels:
    {{- include "teknikerp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: teknikerp-backup
  labels:
    {{- include "teknikerp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mysql:8.0
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: {{ .Values.timezone | quote }}
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "teknikerp.secretName" . }}
                      key: mysql-root-password
              command:
                - sh
                - -c
                - |
                  set -e
                  STAMP="$(date +%Y%m%d-%H%M)"
                  FILE="/backups/{{ .Values.tenant.id }}-${STAMP}.sql.gz"

                  echo "==> Yedek aliniyor: ${FILE}"
                  # --single-transaction: tabloları kilitlemeden tutarlı yedek
                  mysqldump \
                    -h {{ include "teknikerp.mysqlName" . }} \
                    -u root \
                    --single-transaction \
                    --routines \
                    --default-character-set=utf8mb4 \
                    {{ include "teknikerp.database" . }} | gzip > "${FILE}"

                  # Boş/bozuk yedek bırakma
                  if [ ! -s "${FILE}" ]; then
                    echo "HATA: yedek dosyasi bos."
                    rm -f "${FILE}"
                    exit 1
                  fi

                  echo "==> Tamam ($(du -h "${FILE}" | cut -f1))"
                  echo "==> {{ .Values.backup.keepDays }} gunden eski yedekler siliniyor..."
                  find /backups -name '{{ .Values.tenant.id }}-*.sql.gz' -mtime +{{ .Values.backup.keepDays }} -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: teknikerp-backup-pvc
{{- end }}
