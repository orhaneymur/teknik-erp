{{- $name := include "teknikerp.backendName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    tier: backend
    {{- include "teknikerp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        tier: backend
    spec:
      # Sema kurulumu initContainer olarak calisir — asil kap ancak bu
      # basariyla bittikten SONRA baslar.
      #
      # Neden Job degil: uygulama acilirken app.listen()'den once
      # ensureDepots() ile prisma.branch sorgusu atiyor. Bos veritabaninda
      # tablo olmadigi icin cokuyor. Migration'i post-install Job'a koyunca
      # kilitlenme olusuyordu: Helm Job'u pod'lar Ready olduktan sonra
      # calistirir, backend ise sema olmadan Ready olamaz.
      #
      # prisma migrate deploy idempotent'tir; sema gunceldse hicbir sey
      # yapmadan hizlica cikar, bu yuzden her pod baslangicinda calismasi
      # sorun degil.
      initContainers:
        - name: migrate
          image: {{ include "teknikerp.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "teknikerp.secretName" . }}
                  key: database-url
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> MySQL bekleniyor..."
              for i in $(seq 1 60); do
                if node -e "
                  const net = require('net');
                  const s = net.connect(3306, '{{ include "teknikerp.mysqlName" . }}');
                  s.on('connect', () => { s.end(); process.exit(0); });
                  s.on('error', () => process.exit(1));
                " 2>/dev/null; then
                  echo '==> MySQL hazir.'
                  break
                fi
                echo "    bekleniyor ($i/60)..."
                sleep 5
              done

              echo "==> Migration uygulaniyor (prisma migrate deploy)..."
              npx prisma migrate deploy

              echo "==> Sema hazir."
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: backend
          image: {{ include "teknikerp.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: TENANT_NAME
              value: {{ .Values.tenant.companyName | quote }}
            - name: ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "teknikerp.secretName" . }}
                  key: database-url
            # Müşteriye özel — paylaşılırsa bir müşterinin oturum token'ı
            # diğerinde de geçerli olur.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "teknikerp.secretName" . }}
                  key: jwt-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "teknikerp.secretName" . }}
                  key: admin-password
          # /api/health yalnızca "SELECT 1" atar. İş verisine bakan bir
          # endpoint kullanılsaydı yeni açılan boş müşteride pod hiç Ready
          # olmaz, kurulum takılırdı.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "teknikerp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
