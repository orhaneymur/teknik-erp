{{/*
Veritabanı şemasını kuran/güncelleyen Job.

post-install + post-upgrade hook olarak çalışır: kurulumda MySQL henüz
ayakta olmayabileceği için önce onu bekler, sonra `prisma migrate deploy`
ile şemayı uygular. Yeni müşteride boş veritabanına tüm tablolar kurulur;
mevcut müşteride yalnızca eksik migration'lar uygulanır (idempotent).

Bu sayede müşteri açarken elle SQL çalıştırmak gerekmez.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: teknikerp-migrate
  labels:
    {{- include "teknikerp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    # Başarılı Job silinsin, başarısız olan incelenmek üzere kalsın.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # 30 dakika içinde bitmezse vazgeç (takılı kalmasın)
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: teknikerp-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "teknikerp.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "teknikerp.secretName" . }}
                  key: database-url
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> MySQL bekleniyor..."
              for i in $(seq 1 60); do
                if node -e "
                  const net = require('net');
                  const s = net.connect(3306, '{{ include "teknikerp.mysqlName" . }}');
                  s.on('connect', () => { s.end(); process.exit(0); });
                  s.on('error', () => process.exit(1));
                " 2>/dev/null; then
                  echo '==> MySQL hazir.'
                  break
                fi
                echo "    bekleniyor ($i/60)..."
                sleep 5
              done

              echo "==> Migration uygulaniyor (prisma migrate deploy)..."
              npx prisma migrate deploy

              echo "==> Sema hazir."
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
