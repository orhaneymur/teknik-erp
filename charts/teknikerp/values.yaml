# TeknikERP — müşteri başına varsayılan değerler.
#
# Her müşteri kendi namespace'inde bu chart'tan bir kopya çalıştırır.
# Kurulum: bash k8s/new-tenant.sh <kisa-ad> "<Firma Adı>"

# ── Müşteri kimliği ────────────────────────────────────────────────────────
tenant:
  # Kısa ad — namespace ve alt alan adında kullanılır. Küçük harf, tire.
  # Örn: "akgunteknik", "demo", "xyzoto"
  id: ""
  # Arayüzde, fişlerde ve barkod etiketlerinde görünen firma adı.
  companyName: ""
  # Fiş altına basılan iletişim satırı (isteğe bağlı).
  contact: ""
  currency: "TRY"

# ── Alan adı ───────────────────────────────────────────────────────────────
domain:
  # Musteri adresi soyle olusur:  <tenant.id><tenantSuffix>.<base>
  #   demo        -> demo-erp.derneklab.com
  #   akgunteknik -> akgunteknik-erp.derneklab.com
  #
  # NEDEN NOKTA DEGIL TIRE ("demo-erp" ama "demo.erp" degil)?
  # Cloudflare'in ucretsiz Universal SSL sertifikasi yalnizca
  # "derneklab.com" ve "*.derneklab.com"u kapsar — TEK seviye.
  # "demo.erp.derneklab.com" iki seviye oldugu icin sertifikanin disinda
  # kalir ve Cloudflare TLS el sikismasini reddeder: site HTTP'de acilir,
  # HTTPS'te acilmaz. Tire kullanarak adresi tek seviyede tutuyoruz,
  # boylece HTTPS ucretsiz ve otomatik calisir.
  # (Cok seviyeli isteniyorsa: Cloudflare Advanced Certificate Manager,
  #  ayda 10 USD — ya da kumeye cert-manager kurulup proxy kapatilir.)
  #
  # Wildcard kaydi da yok, bu yuzden HER yeni musteri icin tek bir kayit:
  #   Type A | Name <ad>-erp | IPv4 213.238.168.227 | Proxy: Proxied
  base: "derneklab.com"
  tenantSuffix: "-erp"

# ── Docker imajları — tüm müşterilerde AYNI ────────────────────────────────
image:
  registry: "since1907"
  backend: "teknikerp-backend"
  frontend: "teknikerp-frontend"
  # Müşteri bazında farklı sürüm çalıştırmak için helm upgrade --set image.tag=
  # v1.9.2: arayuzdeki sabit "AKG" markasi kaldirildi, demo seed script'i eklendi
  tag: "v1.9.2"
  pullPolicy: "IfNotPresent"

# ── Uygulama katmanları ────────────────────────────────────────────────────
backend:
  # Küçük müşterilerde 1 yeterli. Akgün Teknik gibi yoğun kullanımda 2.
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

frontend:
  replicas: 1
  resources:
    requests:
      memory: "16Mi"
      cpu: "10m"
    limits:
      memory: "128Mi"
      cpu: "200m"

mysql:
  storage: "5Gi"
  # Boş bırak — kurulumda rastgele üretilir ve Secret'ta saklanır.
  # Elle verirsen YALNIZCA harf/rakam kullan (URL'de kaçış sorunu olmasın).
  rootPassword: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

# ── Giriş bilgileri ────────────────────────────────────────────────────────
auth:
  adminUsername: "admin"
  # Boş bırak — rastgele üretilir, kurulum sonunda ekrana yazılır.
  adminPassword: ""
  # Boş bırak — müşteriye özel rastgele JWT secret üretilir.
  # ASLA müşteriler arasında paylaşma: paylaşılırsa bir müşterinin token'ı
  # diğerinde de geçerli olur.
  jwtSecret: ""

# ── Dış erişim ─────────────────────────────────────────────────────────────
ingress:
  enabled: true
  # DIKKAT — dev.prod.com kumesinde hem traefik hem nginx kurulu, ama
  # 80/443 portlarini traefik tutuyor (ingress-nginx'in svclb pod'u
  # "Pending" durumda). Calisan tum ingress'ler traefik kullaniyor,
  # akgun.derneklab.com dahil. Bu yuzden varsayilan traefik.
  className: "traefik"
  # Boş ise <tenant.id>.<domain.base> kullanılır.
  host: ""
  tls:
    # Kume icinde sertifika URETILMEZ: cert-manager kurulu degil, acilirsa
    # sertifika alinamaz ve site hic acilmaz. Kapali kalmali.
    enabled: false
    clusterIssuer: "letsencrypt-prod"
    # HTTPS'i Cloudflare sonlandiriyor (kayitlar "Proxied"): tarayici ->
    # Cloudflare HTTPS, Cloudflare -> sunucu HTTP. Yani kullanici HTTPS
    # gorur ama Ingress'in TLS yapmasi gerekmez. Bu deger yalnizca ekrana
    # dogru adresin ("https://...") yazilmasi icin kullanilir.
    edgeTerminated: true
  # Asagidaki iki deger YALNIZCA className "nginx" iken kullanilir.
  # Traefik bu annotation'lari yok sayar (varsayilanlari zaten yeterli).
  proxyBodySize: "50m"
  proxyTimeout: "600"

# ── Yedekleme ──────────────────────────────────────────────────────────────
backup:
  enabled: true
  # Her gece 03:00 (Europe/Istanbul)
  schedule: "0 3 * * *"
  # Yedeklerin tutulacağı süre (gün)
  keepDays: 14
  storage: "5Gi"

# ── Demo ortamı ────────────────────────────────────────────────────────────
# Yalnızca demo müşterisinde açılır: her gece veritabanını sıfırlar.
demoReset:
  enabled: false
  schedule: "0 4 * * *"

timezone: "Europe/Istanbul"
